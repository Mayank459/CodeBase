name: CodeBase CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    name: Test, Guardrails & Evals Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run Linter (Ruff)
        run: |
          ruff check . --ignore E501,E402

      - name: Run Core & Guardrail Unit Tests
        run: |
          pytest tests/test_guardrails.py tests/test_observability.py tests/test_evals.py -v

      - name: Execute Retrieval & LLM Benchmark Suite
        run: |
          python evals/run_evals.py

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: evals_report.json
          retention-days: 7

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: test-and-eval

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: codebase-backend:latest
